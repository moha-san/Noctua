# Publica la web (versión de un solo archivo) en GitHub Pages en cada cambio de main.
# Para activarlo: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:html
      - name: Preparar la carpeta de la web
        run: |
          mkdir -p site
          cp dist/athenaeum.html site/index.html
          cp -r spa/public/* site/
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
